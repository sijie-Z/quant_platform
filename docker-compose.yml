version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      # The LLM analyzers call DeepSeek through the OpenAI-compatible SDK;
      # OPENAI_API_KEY here did nothing because the code reads DEEPSEEK_API_KEY.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Required: without a token every /api route is loopback-only, and a
      # published container port is not loopback. Set this in .env.
      - QUANT_API_TOKEN=${QUANT_API_TOKEN:?Set QUANT_API_TOKEN in .env before exposing port 8000}
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    volumes:
      - quant-data:/app/results
      - quant-cache:/app/.quant_cache
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim has no curl/wget — probe over the stdlib instead.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  quant-data:
  quant-cache:
