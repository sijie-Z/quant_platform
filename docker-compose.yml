version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=INFO
    volumes:
      - quant-data:/app/results
      - quant-cache:/app/.quant_cache
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim has no curl/wget — probe over the stdlib instead.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  quant-data:
  quant-cache:
