name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the previous run instead of queueing
# behind it — matters most for the Docker job, which is the slow one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repo. CodeQL needs more and
# asks for it in its own workflow.
permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback. Runs in well under a minute and needs none of the heavy
  # scientific stack, so a lint failure never waits on a 3-minute pip install.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff==0.15.12 mypy==1.14.1

      - name: Ruff
        run: ruff check . --output-format=github

      # Scoped to the new quant_core package on purpose: it is the one tree
      # that is fully annotated, so the gate is meaningful. The legacy tree
      # is checked by pre-commit but not gated here.
      - name: Mypy (quant_core)
        run: mypy packages/quant_core/src --config-file=pyproject.toml

  # ---------------------------------------------------------------------------
  # Python 3.11 is the floor, not 3.10: scipy==1.16.0 and tables==3.11.1 both
  # declare requires-python >=3.11, so a 3.10 leg could never install.
  # ---------------------------------------------------------------------------
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./packages/quant_core
          pip install -e .

      # The repo root *is* the quant_platform package; putting its parent on
      # PYTHONPATH is what makes `import quant_platform` resolve. Depends on
      # the checkout directory being named `quant_platform`.
      - name: Make quant_platform importable
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.." >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pytest tests/ -q --tb=short \
              --cov --cov-report=xml --cov-report=term:skip-covered
          else
            pytest tests/ -q --tb=short
          fi

      - name: Upload coverage
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Dependency vulnerability audit. Report-only for now: the pinned set
  # (numpy 1.26.2, pandas 2.1.3, ...) predates current advisories, so gating
  # on it today would leave CI permanently red. Flip `continue-on-error` off
  # once the report has been triaged and the pins refreshed.
  # ---------------------------------------------------------------------------
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit pinned dependencies
        continue-on-error: true
        run: pip-audit -r requirements.txt --format json --output pip-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: warn

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # Builds the real image and proves it boots and serves /api/health. This is
  # the gate that caught the missing quant_core install: the test job passes
  # `pip install -e ./packages/quant_core` explicitly, so only the Dockerfile
  # could prove the packaging was actually complete.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test, build-frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: quant-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container starts
        run: |
          docker run -d --name test-container -p 8000:8000 quant-platform:ci
          for i in $(seq 1 24); do
            sleep 5
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Health check passed after $((i * 5))s"
              exit 0
            fi
            # Fail fast instead of polling a container that already died.
            if [ "$(docker inspect -f '{{.State.Running}}' test-container 2>/dev/null)" != "true" ]; then
              echo "Container exited before becoming healthy"
              break
            fi
            echo "Attempt $i/24 — not ready yet..."
          done
          echo "--- container logs ---"
          docker logs test-container 2>&1 | tail -60
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f test-container || true
