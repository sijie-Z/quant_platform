[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_platform"
version = "0.1.0"
description = "A-Share Multi-Factor Quantitative Trading Platform"
readme = "README.md"
license = { text = "MIT" }
## Upper bound is deliberate, not an oversight: numpy==1.26.2 and
## pandas==2.1.3 have no wheels for 3.13+, and pandas 3.x removes the `'M'`
## resampling alias this codebase still uses in four places. Better to refuse
## the install with a clear message than to fail later or silently change
## research output. See docs/AUDIT_OPEN_QUESTIONS.md (Q3).
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.2",
    "pandas==2.1.3",
    "scipy==1.16.0",
    "scikit-learn==1.7.2",
    "cvxpy==1.7.5",
    "numba==0.63.1",
    "tushare==1.4.29",
    "baostock==0.9.1",
    "akshare==1.18.59",
    "tables==3.11.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "pydantic==2.12.5",
    "python-multipart==0.0.6",
    "websocket-client==1.9.0",
    "httpx==0.28.1",
    # CPU-only build; the plain `xgboost` wheel pulls in 342 MB of
    # nvidia-nccl-cu12 on Linux. Same version, same `xgboost` module.
    "xgboost-cpu==2.1.4",
    "lightgbm==4.5.0",
    "shap==0.46.0",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.0",
    "tzdata==2026.2",
    "openpyxl==3.1.5",
    "adata>=1.0.0",
]
authors = [
    { name = "Quant Platform Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
quant = "quant_platform.main:main"

[tool.setuptools]
# The repo root IS the `quant_platform` package. Package it under that name
# instead of installing its 46 subdirectories as top-level packages: the old
# `packages.find include=["*"]` installed `data`, `core`, ... directly, which
# created a second module identity (`data.x` vs `quant_platform.data.x`) and
# split every module-level singleton in two (issue #69).
#
# Subpackages must be listed explicitly. With only the root package, a
# non-editable `pip install .` produced a wheel containing four top-level
# modules and none of the subpackages, so the installed CLI failed on import.
# `package-dir` maps the `quant_platform` prefix to the repo root, so the
# remaining dotted path (`data.providers`) resolves to `./data/providers`.
# `tests/test_architecture/test_package_manifest.py` fails if a new
# subpackage is added without updating this list.
packages = [
    "quant_platform",
    "quant_platform.agent",
    "quant_platform.alpha",
    "quant_platform.api",
    "quant_platform.backtest",
    "quant_platform.compliance",
    "quant_platform.config",
    "quant_platform.core",
    "quant_platform.core.protocols",
    "quant_platform.data",
    "quant_platform.data.providers",
    "quant_platform.execution",
    "quant_platform.factors",
    "quant_platform.factors.expressions",
    "quant_platform.factors.store",
    "quant_platform.framework",
    "quant_platform.framework.contracts",
    "quant_platform.kernel",
    "quant_platform.lab",
    "quant_platform.lab.registry",
    "quant_platform.lab.reports",
    "quant_platform.lab.runs",
    "quant_platform.operations",
    "quant_platform.portfolio",
    "quant_platform.regime_router",
    "quant_platform.reporting",
    "quant_platform.research",
    "quant_platform.risk",
    "quant_platform.services",
    "quant_platform.shared",
    "quant_platform.trading",
    "quant_platform.utils",
    "quant_platform.utils.cyext",
]

[tool.setuptools.package-dir]
quant_platform = "."

[tool.setuptools.package-data]
# `load_config(None)` resolves the default YAML relative to the installed
# package. Wheels do not include non-code files unless declared here, so a
# pip-installed `quant` command failed with FileNotFoundError.
"quant_platform.config" = ["*.yaml"]

# ---------------------------------------------------------------------------
# ruff — fast Python linter (replaces flake8 + isort + autoflake)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "T20"]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "E402",   # module-import-not-at-top-of-file — needed for sys.path setup
    "E731",   # lambda-assignment — sometimes clearer
    "T201",   # print statements — OK for CLI scripts
    "N806",   # non-lowercase variable — ML code uses X/y conventionally
    "N803",   # non-lowercase argument — ML code conventions
    "B007",   # unused loop variable — common when using enumerate for index
    "SIM108", # ternary preference — if/else is clearer in many cases
    "SIM102", # nested if — readability preference
    "SIM105", # suppress context manager — try/except pass is explicit
    "SIM117", # nested with — readability preference
    "E701",   # multiple statements on one line
    "N805",   # first-argument-name — valid for some patterns
    "E741",   # ambiguous variable name — `l` is readable in context
    "F401",   # unused import — some needed for re-exports / side effects
    "F811",   # redefined variable — common in test parametrization
    "SIM113", # enumerate with start=0 — redundant but harmless
    "SIM115", # open with context handler — fine for simple cases
    "B005",   # strip with set — acceptable
    "B017",   # assertRaises Exception — not always a concern
    "UP042",  # StrEnum — Python 3.10 compat
]

[tool.ruff.format]
quote-style = "single"

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
# 3.12 rather than the 3.11 package floor: numpy>=2 stubs use PEP 695 `type`
# statements, which mypy refuses to parse under a lower target. 3.11 syntax
# compatibility is enforced by ruff's target-version = "py311" instead.
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "quant_platform.utils.cyext.*",
    "tushare",
    "baostock",
    "akshare",
    "cvxpy",
    "shap",
    "numba",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: marks tests as async",
]
asyncio_mode = "auto"
# A hung test must fail with a stack dump instead of eating the job timeout.
timeout = 300
timeout_method = "thread"
filterwarnings = [
    "ignore::DeprecationWarning:dateutil.*",
    "ignore::DeprecationWarning:pytz.*",
    "ignore::DeprecationWarning:openpyxl.*",
    "ignore::UserWarning:sklearn.*",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["quant_platform"]
omit = [
    "*/tests/*",
    "*/node_modules/*",
    "*/frontend/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
